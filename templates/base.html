<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome Icons for actions -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{{ url_for('dashboard') }}" class="navbar-logo">Dashboard</a>
            <div class="navbar-links">
                <a href="{{ url_for('add_reminder') }}" class="navbar-item">Add Reminder</a>
                <a href="{{ url_for('settings_page') }}" class="navbar-item">Settings</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Optional Footer -->
    <footer class="footer">
        <p>&copy; 2025 CIVICA Health. All rights reserved.</p>
    </footer>
</body>
</html>
